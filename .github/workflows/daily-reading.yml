name: Daily VC Reading Newsletter

on:
  schedule:
    # ~7am Central window. Cron is UTC. GitHub frequently DELAYS or DROPS
    # scheduled runs, so we fire several times; the script de-duplicates per day
    # (last_sent_date), so whichever lands first sends and the rest no-op — you
    # never get more than one email.
    - cron: '13 12 * * *'   # ~7:13am CT
    - cron: '37 12 * * *'   # ~7:37am CT
    - cron: '11 13 * * *'   # ~8:11am CT
    - cron: '41 13 * * *'   # ~8:41am CT
  workflow_dispatch:        # manual "Run workflow" button (forces a send)

permissions:
  contents: write           # to commit last_sent_date back

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VC_MODEL: ${{ vars.VC_MODEL }}                 # optional; defaults to claude-opus-4-8
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}  # recommended email backend
          RESEND_FROM: ${{ vars.RESEND_FROM }}           # optional sender override
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}    # alternative backend
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}    # optional; defaults to your inbox
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}        # optional archive
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        # Manual runs force a send; scheduled runs respect same-day de-dup.
        run: python -m vc_reading.newsletter ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Persist send marker
        if: success()
        run: |
          git config user.name  "vc-reading-bot"
          git config user.email "actions@github.com"
          git add vc_reading/data/state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore: mark newsletter sent [skip ci]"
            git push
          fi
