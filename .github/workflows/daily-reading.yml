name: Daily VC Reading Newsletter

on:
  schedule:
    # Cron is in UTC. GitHub heavily delays/drops jobs scheduled on the hour
    # (:00), so we use odd off-hour minutes. The script de-duplicates per day
    # (last_sent_date), so the BACKUP run only sends if the primary was dropped —
    # it never double-sends.
    - cron: '37 12 * * *'   # primary  ~7:37am Central
    - cron: '7 14 * * *'    # backup   ~9:07am Central (fires only if primary missed)
  workflow_dispatch:        # lets you trigger a send manually from the Actions tab

permissions:
  contents: write           # needed to commit the rotation state back to the repo

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VC_MODEL: ${{ vars.VC_MODEL }}            # optional; defaults to claude-opus-4-8
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}  # optional; defaults to GMAIL_ADDRESS
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        # Manual runs force a send (bypass same-day de-dup); scheduled runs respect it.
        run: python -m vc_reading.newsletter ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Persist rotation state
        run: |
          git config user.name  "vc-reading-bot"
          git config user.email "actions@github.com"
          git add vc_reading/data/state.json vc_reading/data/pool_cache.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update VC reading rotation state [skip ci]"
            git push
          fi
